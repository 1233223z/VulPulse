<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VulPulse{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary-subtle">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Vul<span class="text-primary">Pulse</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'vulns' %}active{% endif %}" href="/vulns">Vulnerabilities</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'vendors' %}active{% endif %}" href="/vendors">Vendors</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active == 'sources' %}active{% endif %}" href="/sources">Sources</a>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/docs" target="_blank" rel="noopener">API Docs</a></li>
          <li class="nav-item">
            <a class="nav-link" href="https://github.com/1233223z/VulPulse" target="_blank" rel="noopener">GitHub</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top border-secondary-subtle py-3 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between gap-2 text-secondary footer">
      <span>VulPulse · public vulnerability intelligence</span>
      <span>Defensive use only · data belongs to its sources</span>
    </div>
  </footer>

  <script src="{{ url_for('static', path='vendor/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
