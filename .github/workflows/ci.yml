name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: |
          set -o pipefail
          pytest -q --tb=short --cov=vulpulse --cov-fail-under=75 2>&1 | tee pytest.log
      - name: Test failure summary
        if: failure()
        run: |
          {
            echo '### Pytest failure'
            echo '```'
            tail -200 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: vulpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start stack
        env:
          VULPULSE_API_KEY: smoke-api-key
          VULPULSE_SESSION_SECRET: smoke-session-secret
          VULPULSE_SCHEDULER_RUN_ON_START: "false"
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Verify endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/plugins | python -c \
            "import json, sys; data=json.load(sys.stdin); names={item['name'] for item in data}; assert {'nvd','cisa_kev','exploitdb'} <= names"
          curl -fsS http://127.0.0.1:8000/metrics | grep -q vulpulse_http_requests_total
          curl -fsS 'http://127.0.0.1:8000/api/v1/export?format=csv' | head -n 1 | grep -q '^cve_id,title,severity'
          summary_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'X-API-Key: smoke-api-key' \
            http://127.0.0.1:8000/api/v1/admin/vulns/CVE-2021-44228/summary)
          test "$summary_status" = "503"
          docker compose -f deploy/docker-compose.yml exec -T api \
            vulpulse backup --output /tmp/vulpulse-smoke.db
          docker compose -f deploy/docker-compose.yml exec -T api test -s /tmp/vulpulse-smoke.db
          docker compose -f deploy/docker-compose.yml exec -T api vulpulse version
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  postgres:
    name: postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_DB: vulpulse
          POSTGRES_USER: vulpulse
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulpulse -d vulpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Migrate PostgreSQL
        env:
          VULPULSE_DATABASE_URL: postgresql+asyncpg://vulpulse:test-password@localhost:5432/vulpulse
        run: vulpulse init-db
      - name: Integration test
        env:
          VULPULSE_TEST_POSTGRES_URL: postgresql+asyncpg://vulpulse:test-password@localhost:5432/vulpulse
        run: pytest -q tests/integration/test_postgres.py

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: OSV audit
        run: python scripts/osv_audit.py
