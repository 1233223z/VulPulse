name: vulpulse

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: vulpulse
      POSTGRES_USER: vulpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulpulse}
    volumes:
      - vulpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulpulse -d vulpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    environment:
      VULPULSE_DATABASE_URL: postgresql+asyncpg://vulpulse:${POSTGRES_PASSWORD:-vulpulse}@postgres:5432/vulpulse
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      VULPULSE_DATABASE_URL: postgresql+asyncpg://vulpulse:${POSTGRES_PASSWORD:-vulpulse}@postgres:5432/vulpulse
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    environment:
      VULPULSE_DATABASE_URL: postgresql+asyncpg://vulpulse:${POSTGRES_PASSWORD:-vulpulse}@postgres:5432/vulpulse
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  vulpulse-postgres:
